name: Teamnote
description: >-
  TeamNote is an enterprise mobile productivity and secure communication platform
  founded in Hong Kong in 2014 and part of Y Combinator's Winter 2015 batch.
  Positioned as "Slack for mobile workforces," it gives corporations a mobile-first
  workspace for team messaging, collaboration, workflow forms, announcements, and
  content distribution to frontline and deskless staff, with enterprise security
  and administration controls. The product originally shipped at teamnoteapp.com
  (its first customer was Cheung Kong Holdings) and the company now presents at
  teamnote.ai. No public developer API, OpenAPI specification, SDK, or documentation
  surface was discoverable during enrichment; both web properties are bot-protected.
